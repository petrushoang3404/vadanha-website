  - name: projects_data
    label: "Dự án (ảnh & màu sắc)"
    files:
      - name: projects
        label: "Danh sách dự án"
        file: src/content/projects.json
        format: json
        fields:
          - name: projects
            label: "Dự án"
            label_singular: "Dự án"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: slug, label: "Mã dự án (không đổi)", widget: string, hint: "Dùng để nối với nội dung chữ ở mục Dự án. Không nên sửa." }
              - { name: name, label: "Tên thương hiệu", widget: string }
              - { name: category, label: "Danh mục", widget: select, options: [{label: "Thương mại điện tử", value: ecommerce}, {label: "Doanh nghiệp", value: corporate}, {label: "Thiết kế lại", value: redesign}, {label: "SaaS", value: saas}] }
              - { name: image, label: "Ảnh dự án", widget: image, required: false, hint: "Tùy chọn. Nếu để trống, trang dùng hình minh họa vẽ sẵn. Nên dùng ảnh tỷ lệ 4:3." }
              - { name: layout, label: "Kiểu bố cục mockup", widget: select, options: [split, products, centered, dashboard, editorial] }
              - name: theme
                label: "Màu sắc"
                widget: object
                fields:
                  - { name: bg, label: "Nền", widget: color }
                  - { name: fg, label: "Chữ", widget: color }
                  - { name: accent, label: "Màu nhấn", widget: color }
                  - { name: accentFg, label: "Chữ trên màu nhấn", widget: color }
                  - { name: tile, label: "Màu ô phụ", widget: color }
                  - { name: serif, label: "Dùng font có chân (serif)", widget: boolean, required: false }

