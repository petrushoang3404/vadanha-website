# Sveltia CMS configuration. Dashboard: /admin/
# Docs: https://sveltiacms.app/en/docs
backend:
  name: github
  repo: petrushoang3404/vadanha-website
  branch: main
  # TODO: URL của Sveltia CMS Authenticator (Cloudflare Worker). Xem README, mục "Quản lý nội dung".
  base_url: https://sveltia-cms-auth.hoangminhhien3404.workers.dev

# Ảnh tải lên được lưu vào public/uploads và phục vụ tại /uploads/...
media_folder: public/uploads
public_folder: /uploads

# Ngôn ngữ giao diện CMS
locale: vi

i18n:
  structure: multiple_folders
  locales: [vi, en]
  default_locale: vi

collections:
